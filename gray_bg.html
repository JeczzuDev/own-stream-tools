<!--
- Neutral (white/gray) variant of index.html, for tinting in OBS.
-
- Apply Color Correction and set its "Color" field: that field multiplies, so
- white takes the tint at full strength and each darker layer becomes a deeper
- shade of it. One hue per scene, no extra decoding cost.
-
- The five levels preserve the exact L* spacing of the blue original (19.9
- points), just relocated so the sky lands on pure white:
-   #0057a8 -> #ffffff   #004c93 -> #f1f1f1   #00417e -> #e3e3e3
-   #003669 -> #d5d5d5   #002b54 -> #c7c7c7
-
- See gray_flat_bg.html for the version without gradient drift.
-->

<svg preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80" style="background: #ffffff;">
    <defs>
        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
            }


            .links {
                position: fixed;
                bottom: 20px;
                right: 20px;
                font-size: 18px;
                font-family: sans-serif;
            }

            a {
                text-decoration: none;
                color: black;
                margin-left: 1em;
            }

            a:hover {
                text-decoration: underline;
            }

            a img.icon {
                display: inline-block;
                height: 1em;
                margin: 0 0 -0.1em 0.3em;
            }

            @keyframes rotate {
                0% {
                    transform: scale(1) rotate(0deg);
                }

                100% {
                    transform: scale(1.5) rotate(360deg);
                }
            }

            .out-top {
                animation: rotate 20s linear infinite alternate;
                transform-origin: 13px 25px;
            }

            .in-top {
                animation: rotate 10s linear infinite alternate;
                transform-origin: 13px 25px;
            }

            .out-bottom {
                animation: rotate 25s linear infinite alternate;
                transform-origin: 84px 93px;
            }

            .in-bottom {
                animation: rotate 15s linear infinite alternate;
                transform-origin: 84px 93px;
            }
        </style>

        <!-- Animated neutral gradients: same drift as the blue original, remapped to gray -->
        <linearGradient id="grayGradA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f1f1f1">
                <animate attributeName="stop-color" values="#f1f1f1;#e3e3e3;#d5d5d5;#e3e3e3;#f1f1f1" dur="12s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#d5d5d5">
                <animate attributeName="stop-color" values="#d5d5d5;#ffffff;#f1f1f1;#ffffff;#d5d5d5" dur="12s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <linearGradient id="grayGradB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e3e3e3">
                <animate attributeName="stop-color" values="#e3e3e3;#d5d5d5;#c7c7c7;#d5d5d5;#e3e3e3" dur="9s"
                    repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#c7c7c7">
                <animate attributeName="stop-color" values="#c7c7c7;#e3e3e3;#ffffff;#e3e3e3;#c7c7c7" dur="9s"
                    repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>

    <path fill="url(#grayGradA)" class="out-top"
        d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z" />
    <path fill="url(#grayGradB)" class="in-top"
        d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z" />
    <path fill="url(#grayGradA)" class="out-bottom"
        d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z" />
    <path fill="url(#grayGradB)" class="in-bottom"
        d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z" />
</svg>
